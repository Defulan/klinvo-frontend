name: Frontend Jobs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: TypeScript & Biome checks and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Types check (TypeScript)
        run: npx tsc --noEmit
      
      - name: Linter check (Biome)
        run: npx @biomejs/biome ci .
      
      - name: Build project
        run: npm run build
  
  
  readme-reminder:
    name: README update reminder
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
          
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check new files and send reminder if README doesn't updated
        run: |
          NEW_FILES=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD)
          
          ALL_CHANGED_FILES=$(git diff --name-only --diff-filter=M origin/${{ github.base_ref }}...HEAD)

          README_UPDATED=$(echo "$ALL_CHANGED_FILES" | grep -i -x 'README.md' || true)
          README_RU_UPDATED=$(echo "$ALL_CHANGED_FILES" | grep -i -x 'README.RU.md' || true)

          if [ -n "$NEW_FILES" ] && { [ -z "$README_UPDATED" ] || [ -z "$README_RU_UPDATED" ]; }; then
            echo "::warning title=Check README::New files are appeared (relative to the main branch) in this branch, but README.md or README.RU.MD doesn't changed"
            echo "The new files:"
            echo "$NEW_FILES"
          fi

